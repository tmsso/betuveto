name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    # ROADMAP Batch 10 item 5: one smoke test (start game -> guess a word -> see score),
    # run against this PR's own bundle (`vite preview`, no dev-time HTML transform) with
    # /api proxied to the live production API — a preview deployment sits behind this
    # project's Vercel SSO wall, which CI has no bypass secret for, and there is no local
    # API server since Batch 1.3's cutover to same-origin Vercel functions. Deliberate
    # tradeoff: every run of this job writes one real (harmless) test game into
    # production, and a production outage would fail this job even with correct code.
    name: E2E smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        working-directory: frontend
        run: npx playwright test
