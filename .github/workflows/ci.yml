name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # ROADMAP 16.8: fail on any new high/critical advisory in production dependencies
      # (known, assessed ones are allow-listed with reasons in the script).
      - name: Dependency audit
        run: node scripts/audit-gate.mjs .

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        run: node scripts/audit-gate.mjs frontend

  e2e:
    # ROADMAP Batch 10 item 5: one smoke test (start game -> guess a word -> see score),
    # run against this PR's own bundle (`vite preview`, no dev-time HTML transform) with
    # /api proxied to the live production API — a preview deployment sits behind this
    # project's Vercel SSO wall, which CI has no bypass secret for, and there is no local
    # API server since Batch 1.3's cutover to same-origin Vercel functions. Deliberate
    # tradeoff: every run of this job writes one real (harmless) test game into
    # production, and a production outage would fail this job even with correct code.
    name: E2E smoke test
    runs-on: ubuntu-latest
    env:
      # ROADMAP Batch 10 item 11: one pinned player identity reused across every CI run
      # (instead of minting a fresh one each time), so the admin dashboard can exclude it
      # from games/day and DAU. Absent until the identity is bootstrapped in production;
      # the test falls back to its old fresh-mint behaviour when unset.
      E2E_CI_PLAYER_COOKIE: ${{ secrets.E2E_CI_PLAYER_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        working-directory: frontend
        run: npx playwright test

      # Diagnostic (added 2026-09-16, betuveto-ci-e2e-github-actions-flake memory): every
      # failure so far has been a bare "waiting for <button>" timeout with no visibility
      # into what the page actually showed. Playwright already writes error-context.md
      # (an ARIA snapshot) per failed test into test-results/ — this just lets it leave
      # the runner instead of vanishing when the job ends.
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  contract:
    # D-14b (ROADMAP Batch 14): run the HTTP contract suite (tests/contract.test.ts, which also
    # carries 11.19's client.ts shape check) against this PR's own Vercel preview. A preview runs
    # on a throwaway per-branch Neon database, so the suite's writes never touch production, and
    # D-14a (lib/identity-throttle.ts) lifts the identity-mint cap there so a full run fits.
    # Skips with a notice (not a failure) when it cannot run meaningfully:
    #   - no VERCEL_AUTOMATION_BYPASS_SECRET repo secret (the preview sits behind the wall);
    #   - the PR adds a migration (the branch database is created from production's schema and
    #     is not migrated automatically, so the new tables would be missing); verify those
    #     PRs by hand after migrating the branch database.
    name: Contract tests (PR preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::Skipped: repo secret VERCEL_AUTOMATION_BYPASS_SECRET is not set."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | grep -q '^migrations/'; then
            echo "::notice::Skipped: this PR adds a migration; the preview database is not migrated automatically. Verify by hand."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Wait for this PR's preview deployment
        if: steps.gate.outputs.run == 'true'
        id: preview
        run: |
          # Vercel reports each deployment to GitHub's Deployments API; read the URL from there
          # instead of using a third-party "wait for Vercel" action.
          for i in $(seq 1 60); do
            for id in $(gh api "repos/${{ github.repository }}/deployments?sha=$HEAD_SHA&per_page=10" --jq '.[] | select(.environment | test("Preview")) | .id'); do
              status=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" --jq '.[0] | "\(.state) \(.environment_url)"')
              state=${status%% *}; url=${status#* }
              if [ "$state" = "success" ]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"; exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Preview deployment $state."; exit 1
              fi
            done
            sleep 15
          done
          echo "::error::Timed out waiting for the preview deployment."; exit 1

      - name: Contract tests against the preview
        if: steps.gate.outputs.run == 'true'
        env:
          API_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npm test
