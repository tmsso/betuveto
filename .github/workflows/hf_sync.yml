name: Sync Backend to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Backend Subfolder to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Navigate to the backend folder
          cd backend

          # Prepare for Hugging Face push: Create a temp directory and copy backend and data
          mkdir -p /tmp/hf_space
          cp -r backend/* /tmp/hf_space/
          cp -r data/* /tmp/hf_space/data/ # Assuming 'data' is a top-level folder here

          # Initialize a git repo in the temp directory
          cd /tmp/hf_space
          git init
          git config user.name "Temp-Bot"
          git config user.email "bot@temp.com"

          # Add all files in the temp folder
          git add .
          git commit -m "Sync from GitHub Actions"

          # Force push to Hugging Face
          git push -f https://thomasso:$HF_TOKEN@huggingface.co/spaces/thomasso/betuveto-api main:main
