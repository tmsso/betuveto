<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3498db" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Betűvető - Magyar szójáték</title>
    <!-- ROADMAP 12.3: what chat apps and search engines show for a shared link. Absolute
         image URL because link-preview crawlers don't resolve relative ones; the domain is
         the production one (the owner decided to stay on it for the test, 2026-09-30). -->
    <meta name="description" content="Rakj ki minél több szót a megkevert betűkből — ingyenes magyar (és angol) szójáték, egyedül, napi rejtvényként vagy barátokkal." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Betűvető" />
    <meta property="og:title" content="Betűvető — magyar szójáték" />
    <meta property="og:description" content="Rakj ki minél több szót a megkevert betűkből. Napi rejtvény, ranglista, játék barátokkal." />
    <meta property="og:url" content="https://betuveto.vercel.app/" />
    <meta property="og:image" content="https://betuveto.vercel.app/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="hu_HU" />
    <meta name="twitter:card" content="summary" />
    <script>
      // ROADMAP Batch 10 item 7 — set the theme before first paint so a dark-mode
      // reload never flashes the light background. The server preference (loaded by
      // useTheme after mount) arrives too late for that; localStorage is the fast path,
      // mirrored on every change. Wrapped in try/catch: a private window or blocked
      // site-data must not stop the page rendering.
      (function () {
        try {
          var stored = localStorage.getItem('betuveto_theme'); // 'light' | 'dark' | 'system' | null
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && systemDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* leave the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
